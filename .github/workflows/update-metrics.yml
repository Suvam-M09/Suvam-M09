name: Nightly Metrics Update

on:
  schedule:
    # Runs at 00:00 UTC every day (Nightly)
    - cron: "0 0 * * *"
  # Allows you to run the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # You need to create a Personal Access Token in Developer Settings
          # and save it in your repository secrets as METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Basic configuration
          user: suvam-m09
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
